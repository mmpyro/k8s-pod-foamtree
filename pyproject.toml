[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8sfoams"
version = "1.15.0"
description = "K8s pod foamtree visualizer"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache 2.0" }
authors = [
    { name = "Michal Marszalek", email = "mmpyro@gmail.com" }
]
keywords = ["foamtree", "k8s", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "kubernetes[google-auth]>=32.0.0",
    "pydash>=8.0.4",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "flake8>=7.1.1",
    "mypy>=1.14.1",
    "mock>=5.1.0",
    "bandit>=1.8.0",
    "bitmath>=1.3.3.1",
    "boto3>=1.42.97",
    "openai>=1.40.0",
]
aws = [
    "boto3>=1.42.97",
]
advisor = [
    "openai>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/mmpyro/k8s-pod-foamtree"

[project.scripts]
k8sfoams = "k8sfoam.src.app:main"

[tool.hatch.build]
# Built by `make web` and gitignored, which hatch would otherwise leave out.
artifacts = ["k8sfoam/src/frontend/bundle.js"]

[tool.hatch.build.targets.wheel]
# docs/*.md ship as k8sfoam/docs: the AI assistant answers from them.
only-include = ["k8sfoam", "docs"]
exclude = [
    "k8sfoam/tests",
    "docs/demo",
    "docs/images",
    "docs/stylesheets",
    "docs/requirements.txt",
]

[tool.hatch.build.targets.wheel.sources]
"docs" = "k8sfoam/docs"

[tool.hatch.build.targets.sdist]
include = [
    "/k8sfoam",
    "/docs/*.md",
]
